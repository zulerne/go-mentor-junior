version: "3"

silent: true

vars:
  BIN_DIR: bin

dotenv: [.env]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  help:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the order service binary
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -o {{.BIN_DIR}}/order ./cmd/order

  fmt:
    desc: Format Go source files
    cmds:
      - |
        files="$(find . -type f -name '*.go' -not -path './.git/*')"
        if [ -n "$files" ]; then gofmt -w $files; fi

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  lint:
    desc: Run Go static analysis and linter
    cmds:
      - task: fmt
      - task: vet
      - golangci-lint run

  lint-fix:
    desc: Run Go static analysis and linter and fix issues
    cmds:
      - task: fmt
      - task: vet
      - golangci-lint run --fix

  test:
    desc: Run the test suite
    cmds:
      - go test ./...

  coverage:
    desc: Run the test suite and generate coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test-race:
    desc: Run the test suite with the race detector
    cmds:
      - go test -race ./...

  test-integration:
    desc: Test PostgreSQL stores in isolated schemas
    requires:
      vars: [TEST_DATABASE_URL]
    env:
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - go test -race -tags integration ./internal/provider/store/... ./internal/services/customer -count=1

  run:
    desc: Build and run the order service
    cmds:
      - task: build
      - ./{{.BIN_DIR}}/order

  migrate:up:
    desc: Apply all pending database migrations
    requires:
      vars: [DATABASE_URL]
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
    preconditions:
      - sh: command -v migrate >/dev/null 2>&1
        msg: Install the migrate CLI (brew install golang-migrate)
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" up

  migrate:down:
    desc: Roll back one database migration
    requires:
      vars: [DATABASE_URL]
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
    preconditions:
      - sh: command -v migrate >/dev/null 2>&1
        msg: Install the migrate CLI (brew install golang-migrate)
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" down 1

  migrate:version:
    desc: Show the current database migration version
    requires:
      vars: [DATABASE_URL]
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
    preconditions:
      - sh: command -v migrate >/dev/null 2>&1
        msg: Install the migrate CLI (brew install golang-migrate)
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" version
